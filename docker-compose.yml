version: '3.9'
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agora_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  backend:
    build: .
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: agora_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: change-me-in-env
    ports:
      - "8080:8080"
volumes:
  mysql_data:
